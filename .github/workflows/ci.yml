name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Bash syntax
        run: for script in bin/norm42 install.sh uninstall.sh; do bash -n "$script"; done
      - name: Run isolated tests
        run: python3 -m unittest discover -s tests -v
